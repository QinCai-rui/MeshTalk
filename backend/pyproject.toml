[project]
name = "meshtalk-backend"
version = "0.1.0"
description = "MeshTalk peer-to-peer messaging backend"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "cryptography>=43.0.0",
    "aiosqlite>=0.20.0",
    "certifi>=2024.8.30",
    "websockets>=14.0",
]

[project.scripts]
meshtalk = "meshtalk.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshtalk"]
