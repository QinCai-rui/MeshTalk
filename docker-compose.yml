services:
  control:
    # docker compose up control
    image: ghcr.io/qincai-rui/meshtalk/control:latest
    # docker compose up --build control
    build:
      context: .
      dockerfile: Dockerfile.control
    ports:
      - "${CONTROL_PORT:-8787}:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  client:
    # docker compose up client
    image: ghcr.io/qincai-rui/meshtalk/client:latest
    # docker compose up --build client
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      - MESHTALK_CONTROL_URL=wss://meshtalk-control.qincai.xyz/v1/rendezvous
      - MESHTALK_STUN_SERVER=stun.l.google.com:19302
    volumes:
      - ./docker_data/meshtalk:/data/meshtalk
    stdin_open: true
    tty: true
    # Host networking is required for LAN peer discovery (UDP broadcast).
    # The control server is reachable via localhost:8787 since it is published to the host.
    # Remove network_mode and set MESHTALK_CONTROL_URL to ws://control:8787 if LAN discovery is not needed.
    network_mode: host
    restart: no

  analytics:
    image: ghcr.io/qincai-rui/meshtalk/analytics:latest
    # docker compose up --build analytics
    build:
      context: .
      dockerfile: analytics/Dockerfile
    environment:
      - PORT=8089
    volumes:
      - ./docker_data/analytics:/data
    ports:
      # Anonymous ingest is spammable by design: bind localhost by default,
      # put the Worker ORIGIN behind a firewall
      - "127.0.0.1:${ANALYTICS_PORT:-8089}:8089"
    restart: unless-stopped

  analytics-dashboard:
    # Read-only dashboard for the aggregate store (no IPs exist to show).
    # Shares the ingest SQLite volume read-only; never writes.
    # Same image as analytics; only the command differs.
    image: ghcr.io/qincai-rui/meshtalk/analytics:latest
    build:
      context: .
      dockerfile: analytics/Dockerfile
    command: ["python", "dashboard.py"]
    environment:
      - ANALYTICS_DB=/data/analytics.sqlite
      - DASHBOARD_PORT=8090
      - BIND=0.0.0.0
    volumes:
      - ./docker_data/analytics:/data:ro
    ports:
      - "127.0.0.1:${ANALYTICS_DASHBOARD_PORT:-8090}:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
