services:
  control:
    # docker compose up control
    image: ghcr.io/qincai-rui/meshtalk/control:latest
    # docker compose up --build control
    build:
      context: .
      dockerfile: Dockerfile.control
    ports:
      - "${CONTROL_PORT:-8787}:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  client:
    # docker compose up client
    image: ghcr.io/qincai-rui/meshtalk/client:latest
    # docker compose up --build client
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      - MESHTALK_CONTROL_URL=wss://meshtalk-control.qincai.xyz/v1/rendezvous
      - MESHTALK_STUN_SERVER=stun.l.google.com:19302
    volumes:
      - meshtalk-data:/data/meshtalk
    stdin_open: true
    tty: true
    # Host networking is required for LAN peer discovery (UDP broadcast).
    # The control server is reachable via localhost:8787 since it is published to the host.
    # Remove network_mode and set MESHTALK_CONTROL_URL to ws://control:8787 if LAN discovery is not needed.
    network_mode: host
    restart: no

  telemetry:
    build:
      context: .
      dockerfile: telemetry/Dockerfile
    environment:
      - PORT=8080
    volumes:
      - telemetry-data:/data
    ports:
      # Anonymous ingest is spammable by design: bind localhost by default,
      # put the Worker ORIGIN behind a firewall, treat counts as approximate.
      - "127.0.0.1:${TELEMETRY_PORT:-8080}:8080"
    restart: unless-stopped

  telemetry-dashboard:
    # Pretty read-only dashboard for the aggregate store (no IPs exist to show).
    # Shares the ingest SQLite volume read-only; never writes.
    build:
      context: .
      dockerfile: telemetry/Dockerfile
    command: ["python", "dashboard.py"]
    environment:
      - TELEMETRY_DB=/data/telemetry.sqlite
      - DASHBOARD_PORT=8090
      - BIND=0.0.0.0
    volumes:
      - telemetry-data:/data:ro
    ports:
      - "127.0.0.1:${TELEMETRY_DASHBOARD_PORT:-8090}:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  meshtalk-data:
  telemetry-data:
