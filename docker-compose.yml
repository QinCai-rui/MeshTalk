services:
  control:
    # docker compose up control
    image: ghcr.io/qincai-rui/meshtalk/control:latest
    # docker compose up --build control
    build:
      context: .
      dockerfile: Dockerfile.control
    ports:
      - "${CONTROL_PORT:-8787}:8787"
    restart: unless-stopped
    environment:
      - CONTROL_TURN_ENABLED=true
      - CONTROL_TURN_PROVIDER=${CONTROL_TURN_PROVIDER:-coturn}
      - CONTROL_TURN_URIS=${TURN_URIS:-turn:localhost:3478?transport=udp}
      - CONTROL_TURN_SHARED_SECRET=${TURN_SHARED_SECRET:-}
      - CONTROL_TURN_TTL_SECONDS=${CONTROL_TURN_TTL_SECONDS:-600}
      - CONTROL_CLOUDFLARE_TURN_TOKEN_ID=${CONTROL_CLOUDFLARE_TURN_TOKEN_ID:-}
      - CONTROL_CLOUDFLARE_API_TOKEN=${CONTROL_CLOUDFLARE_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  turn:
    image: coturn/coturn:4.6.3
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-}
      - --realm=${TURN_REALM:-localhost}
      - --fingerprint
      - --external-ip=${TURN_EXTERNAL_IP:-}
      - --min-port=${TURN_RELAY_MIN_PORT:-49152}
      - --max-port=${TURN_RELAY_MAX_PORT:-49200}
    ports:
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_RELAY_MIN_PORT:-49152}-${TURN_RELAY_MAX_PORT:-49200}:${TURN_RELAY_MIN_PORT:-49152}-${TURN_RELAY_MAX_PORT:-49200}/udp"
    restart: unless-stopped

  client:
    # docker compose up client
    image: ghcr.io/qincai-rui/meshtalk/client:latest
    # docker compose up --build client
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      - MESHTALK_CONTROL_URL=wss://meshtalk-control.qincai.xyz/v1/rendezvous
      - MESHTALK_STUN_SERVER=stun.l.google.com:19302
    volumes:
      - meshtalk-data:/data/meshtalk
    stdin_open: true
    tty: true
    # Host networking is required for LAN peer discovery (UDP broadcast).
    # The control server is reachable via localhost:8787 since it is published to the host.
    # Remove network_mode and set MESHTALK_CONTROL_URL to ws://control:8787 if LAN discovery is not needed.
    network_mode: host
    restart: no

volumes:
  meshtalk-data:
