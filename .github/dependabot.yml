version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      opentui:
        patterns:
          - "@opentui/*"
          - "opentui-spinner"
      react:
        patterns:
          - "react"
          - "@types/react"
          - "react-reconciler"
      typescript:
        patterns:
          - "typescript"
          - "bun-types"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
