name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check account age
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string

      - name: Checkout repository
        if: steps.check.outputs.result == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install opencode
        if: steps.check.outputs.result == 'true'
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Triage issue
        if: steps.check.outputs.result == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          opencode run --agent triage --model opencode/muse-spark-1.3-contributor-free \
            "The following issue was just opened. Triage it and return only the comment body.\n\nTitle: $ISSUE_TITLE\n\n$ISSUE_BODY" \
            > triage-comment.md

      - name: Comment on issue
        if: steps.check.outputs.result == 'true'
        uses: actions/github-script@v7
        env:
          COMMENT_FILE: triage-comment.md
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8').trim();
            if (!body || body === 'NO_COMMENT') return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
