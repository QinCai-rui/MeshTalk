name: Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check edit relevance
        id: relevant
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.action === 'opened') return 'true';
            if (context.payload.action === 'edited') {
              const changes = context.payload.changes || {};
              return (changes.title || changes.body) ? 'true' : 'false';
            }
            return 'false';
          result-encoding: string

      - name: Check account age
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string

      - name: Checkout repository
        if: steps.check.outputs.result == 'true' && steps.relevant.outputs.result == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install opencode
        if: steps.check.outputs.result == 'true' && steps.relevant.outputs.result == 'true'
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Triage issue
        if: steps.check.outputs.result == 'true' && steps.relevant.outputs.result == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          opencode run --format json --agent triage --model opencode/muse-spark-1.3-contributor-free \
            "The following issue was just opened or edited. Triage it and return only the comment body.\n\nTitle: $ISSUE_TITLE\n\n$ISSUE_BODY" \
            > triage-events.jsonl
          jq -sr '[.[] | select(.type == "text") | .part.text] | last // empty' \
            triage-events.jsonl > triage-comment.md

      - name: Create or update triage comment
        if: steps.check.outputs.result == 'true' && steps.relevant.outputs.result == 'true'
        uses: actions/github-script@v7
        env:
          COMMENT_FILE: triage-comment.md
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- meshtalk-issue-triage -->';
            const footer = '<sub>Auto-generated by MeshTalk issue triage (OpenCode). This comment updates automatically when you edit the issue title or description.</sub>';
            let body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8').trim();
            if (!body || body === 'NO_COMMENT') return;

            if (!body.includes(marker)) {
              body += `\n\n${footer}\n${marker}`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
