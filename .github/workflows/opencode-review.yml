name: opencode-review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Gate (PR-only, role, command)
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const body = (context.payload.comment?.body || '').toLowerCase();
            const wants = body.includes('/oc review') || body.includes('/oc rereview') || body.includes('/opencode review') || body.includes('/opencode rereview');
            if (!wants) { core.setOutput('run', 'false'); return; }
            const issue = context.payload.issue;
            const isPR = !!issue?.pull_request || !!context.payload.pull_request;
            if (!isPR) { core.setOutput('run', 'false'); return; }
            const assoc = context.payload.comment?.author_association || '';
            if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(assoc)) { core.setOutput('run', 'false'); return; }
            if (context.payload.comment?.user?.login === 'opencode-agent[bot]') { core.setOutput('run', 'false'); return; }
            core.setOutput('run', 'true');
            core.setOutput('mode', body.includes('rereview') ? 'rereview' : 'review');
          result-encoding: string

      - name: Resolve PR head SHA
        id: resolve
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          echo "sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Run review agent
        if: steps.gate.outputs.run == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"bash":{"*":"deny"}}'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REVIEW_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          BASE_SHA=$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)
          git diff "$BASE_SHA...HEAD" > /tmp/pr.diff
          run_review() {
            opencode run --format json --agent review --model opencode/muse-spark-1.3-contributor-free "${1}Mode: $REVIEW_MODE. PR: $PR_NUMBER. Diff follows." "$(cat /tmp/pr.diff)" > review-events.jsonl
            jq -sr '[.[] | select(.type == "text") | .part.text] | last // empty' review-events.jsonl > review-comment.md
          }
          ATTEMPT=1
          RETRY_PROMPT=""
          VALID=false
          while [ "$ATTEMPT" -le 3 ]; do
            run_review "$RETRY_PROMPT"
            if python3 - <<'PYEOF'
          import json, re, sys

          def fail(errors):
              open('/tmp/sugg-errors.txt', 'w').write(' '.join(errors))
              sys.exit(1)

          text = open('review-comment.md').read()
          m = re.search(r'```suggestions-json\s*(.*?)\s*```', text, re.S)
          if not m:
              fail(['No suggestions-json block was found; end the full review with a JSON array in the required suggestions-json block, using [] when there are no suggestions.'])
          try:
              data = json.loads(m.group(1))
              assert isinstance(data, list)
          except Exception as e:
              fail([f"The suggestions-json block is not valid JSON ({e}); it must be a JSON array of objects."])
          if not data:
              sys.exit(0)

          added = {}
          path = None
          new_line = 0
          for pl in open('/tmp/pr.diff').read().split('\n'):
              dm = re.match(r'diff --git a/(.*) b/(.*)', pl)
              if dm:
                  path = dm.group(2)
                  added.setdefault(path, set())
                  continue
              hm = re.match(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@', pl)
              if hm and path is not None:
                  new_line = int(hm.group(1))
                  continue
              if path is None:
                  continue
              if pl.startswith('+') and not pl.startswith('+++'):
                  added[path].add(new_line)
                  new_line += 1
              elif pl.startswith('-') and not pl.startswith('---'):
                  continue
              elif pl.startswith('\\'):
                  continue
              else:
                  new_line += 1

          def fmt(nums):
              nums = sorted(nums)
              spans = []
              for n in nums:
                  if spans and n == spans[-1][1] + 1:
                      spans[-1][1] += 1
                  else:
                      spans.append([n, n])
              return ', '.join(str(a) if a == b else f"{a}-{b}" for a, b in spans)

          errors = []
          for i, s in enumerate(data):
              tag = f"entry {i}"
              if not isinstance(s, dict):
                  errors.append(f"{tag}: not an object; each entry must be an object with path/line/suggestion.")
                  continue
              p, ln, sug = s.get('path'), s.get('line'), s.get('suggestion')
              bad = []
              if not isinstance(p, str) or not p:
                  bad.append('"path" must be a repo-relative file path from the diff')
              if not isinstance(ln, int) or isinstance(ln, bool):
                  bad.append('"line" must be an integer NEW-file line number')
              if not isinstance(sug, str) or not sug.strip():
                  bad.append('"suggestion" must be a non-empty replacement code string')
              if bad:
                  errors.append(f"{tag}: " + '; '.join(bad) + '.')
                  continue
              end = s.get('end_line', ln)
              if not isinstance(end, int) or isinstance(end, bool) or end < ln:
                  errors.append(f"{tag} ({p}:{ln}): \"end_line\" must be an integer >= line; drop it for single-line fixes.")
                  continue
              lines = added.get(p)
              if not lines:
                  errors.append(f"{tag} ({p}:{ln}): file has no added lines in the PR diff; suggestions must target a file and line changed by this PR.")
                  continue
              missing = [n for n in range(ln, end + 1) if n not in lines]
              if missing:
                  errors.append(f"{tag} ({p}:{ln}-{end}): not all lines are added (+) diff lines (added lines for {p}: {fmt(lines)}); move the suggestion onto added lines or drop the entry.")
          if errors:
              fail(errors)
          sys.exit(0)
          PYEOF
            then
              VALID=true
              break
            fi
            if [ "$ATTEMPT" -eq 3 ]; then
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            RETRY_PROMPT="Your previous response's suggestions-json block had problems, so those suggestions would be skipped: $(cat /tmp/sugg-errors.txt) Return the FULL review again (human summary plus corrected suggestions-json block). "
          done
          if [ "$VALID" != true ]; then
            echo "The review agent's auto-fix suggestions were invalid after 3 attempts and were not posted. Request another review to try again." > /tmp/review-suggestion-retry.md
          fi
          test -s review-comment.md || echo "Review agent returned empty output." > review-comment.md
          python3 - <<'PYEOF'
          import json, re
          text = open('review-comment.md').read()
          m = re.search(r'```suggestions-json\s*(.*?)\s*```', text, re.S)
          try:
              data = json.loads(m.group(1)) if m else []
              assert isinstance(data, list)
          except Exception:
              data = []
          json.dump(data[:10], open('suggestions.json', 'w'))
          clean = re.sub(r'\n?```suggestions-json\s*.*?\s*```\n?', '\n', text, flags=re.S).strip()
          if not clean:
              clean = 'Automated review completed — see inline suggestions on the diff.'
          try:
              clean += '\n\n> ' + open('/tmp/review-suggestion-retry.md').read().strip()
          except FileNotFoundError:
              pass
          open('review-comment.md', 'w').write(clean + '\n')
          PYEOF

      - name: Post summary comment
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- meshtalk-review -->';
            let body = fs.readFileSync('review-comment.md', 'utf8').trim();
            let extra = '';
            try {
              const n = JSON.parse(fs.readFileSync('suggestions.json', 'utf8')).length;
              if (n) extra = `\n\n<sub>${n} inline suggestion${n === 1 ? '' : 's'} posted on the diff — apply from the Files changed tab (Commit suggestion or Add suggestion to batch).</sub>`;
            } catch (e) {}
            body += `${extra}\n\n<sub>Requested via \`${context.payload.comment.body.split('\n')[0].slice(0,80)}\` — updates on rerequest.</sub>\n${marker}`;
            const pr = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, per_page: 100 });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body });

      - name: Post inline suggestions
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let suggestions = [];
            try {
              suggestions = JSON.parse(fs.readFileSync('suggestions.json', 'utf8'));
            } catch (e) { return; }
            if (!Array.isArray(suggestions) || suggestions.length === 0) return;
            const pr = (context.payload.issue && context.payload.issue.number) ||
              (context.payload.pull_request && context.payload.pull_request.number);
            if (!pr) { core.warning('Cannot determine PR number; skipping suggestions.'); return; }
            const commit_id = '${{ steps.resolve.outputs.sha }}';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr, per_page: 100,
            });
            const addedByFile = new Map();
            for (const f of files) {
              if (!f.patch) continue;
              const added = new Set();
              let newLine = 0;
              for (const pl of f.patch.split('\n')) {
                const h = pl.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@/);
                if (h) { newLine = parseInt(h[1], 10); continue; }
                if (pl.startsWith('+') && !pl.startsWith('+++')) { added.add(newLine); newLine += 1; }
                else if (pl.startsWith('-') && !pl.startsWith('---')) { continue; }
                else if (pl.startsWith('\\')) { continue; }
                else { newLine += 1; }
              }
              addedByFile.set(f.filename, added);
            }
            const comments = [];
            for (const s of suggestions.slice(0, 10)) {
              const okShape = s && typeof s.path === 'string' && Number.isInteger(s.line) &&
                typeof s.suggestion === 'string' && s.suggestion.trim();
              if (!okShape) { core.warning('Skipping malformed suggestion entry.'); continue; }
              const added = addedByFile.get(s.path);
              if (!added || added.size === 0) { core.warning(`Skipping suggestion: ${s.path} not in PR diff.`); continue; }
              const end = Number.isInteger(s.end_line) && s.end_line >= s.line ? s.end_line : s.line;
              let onAdded = true;
              for (let ln = s.line; ln <= end; ln++) {
                if (!added.has(ln)) { onAdded = false; break; }
              }
              if (!onAdded) {
                core.warning(`Skipping suggestion: ${s.path}:${s.line}-${end} outside added lines.`);
                continue;
              }
              const body = (s.comment || 'Suggested change:') + '\n```suggestion\n' +
                s.suggestion.replace(/\n+$/, '') + '\n```';
              if (end === s.line) comments.push({ path: s.path, line: s.line, side: 'RIGHT', body });
              else comments.push({ path: s.path, line: end, side: 'RIGHT', start_line: s.line, start_side: 'RIGHT', body });
            }
            if (comments.length === 0) return;
            await github.rest.pulls.createReview({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr,
              commit_id, event: 'COMMENT',
              body: `Automated review: ${comments.length} suggestion${comments.length === 1 ? '' : 's'} below — apply individually or batch them from the Files changed tab.`,
              comments,
            });
