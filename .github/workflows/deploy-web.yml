name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          SITE_URL: https://meshtalk-site.qincai.xyz
      - name: Create Cloudflare Pages project (first run only)
        continue-on-error: true
        working-directory: web
        run: npx --yes wrangler@4 pages project create meshtalk-site --production-branch=main
      - name: Deploy to Cloudflare Pages
        working-directory: web
        # wrangler reads the project name and build output directory from
        # web/wrangler.toml, so it takes no directory argument here.
        run: npx --yes wrangler@4 pages deploy --commit-dirty=true
