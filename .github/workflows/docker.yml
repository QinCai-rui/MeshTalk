name: Publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.base.ref == 'main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      control: ${{ steps.filter.outputs.control }}
      build_matrix: ${{ steps.set-matrix.outputs.matrix }}
      merge_matrix: ${{ steps.set-matrix.outputs.merge_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            client:
              - 'cli/**'
              - 'tui/**'
              - 'backend/**'
              - 'common/**'
              - 'docker/entrypoint-client.sh'
              - 'Dockerfile.client'
              - 'package.json'
              - 'bun.lock*'
              - '.dockerignore'
            control:
              - 'control/**'
              - 'Dockerfile.control'
              - 'package.json'
              - 'bun.lock*'
              - '.dockerignore'

      - name: Set build matrix
        id: set-matrix
        run: |
          BUILD='[]'
          MERGE='[]'

          # Manual dispatch always builds everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD=$(echo "$BUILD" | jq -c '. + [{"component":"control","dockerfile":"Dockerfile.control","platform":"linux/amd64","runner":"ubuntu-latest","slug":"amd64"},{"component":"control","dockerfile":"Dockerfile.control","platform":"linux/arm64","runner":"ubuntu-24.04-arm","slug":"arm64"}]')
            MERGE=$(echo "$MERGE" | jq -c '. + [{"component":"control"}]')
            BUILD=$(echo "$BUILD" | jq -c '. + [{"component":"client","dockerfile":"Dockerfile.client","platform":"linux/amd64","runner":"ubuntu-latest","slug":"amd64"},{"component":"client","dockerfile":"Dockerfile.client","platform":"linux/arm64","runner":"ubuntu-24.04-arm","slug":"arm64"}]')
            MERGE=$(echo "$MERGE" | jq -c '. + [{"component":"client"}]')
          else
            if [ "${{ steps.filter.outputs.control }}" = "true" ]; then
              BUILD=$(echo "$BUILD" | jq -c '. + [{"component":"control","dockerfile":"Dockerfile.control","platform":"linux/amd64","runner":"ubuntu-latest","slug":"amd64"},{"component":"control","dockerfile":"Dockerfile.control","platform":"linux/arm64","runner":"ubuntu-24.04-arm","slug":"arm64"}]')
              MERGE=$(echo "$MERGE" | jq -c '. + [{"component":"control"}]')
            fi

            if [ "${{ steps.filter.outputs.client }}" = "true" ]; then
              BUILD=$(echo "$BUILD" | jq -c '. + [{"component":"client","dockerfile":"Dockerfile.client","platform":"linux/amd64","runner":"ubuntu-latest","slug":"amd64"},{"component":"client","dockerfile":"Dockerfile.client","platform":"linux/arm64","runner":"ubuntu-24.04-arm","slug":"arm64"}]')
              MERGE=$(echo "$MERGE" | jq -c '. + [{"component":"client"}]')
            fi
          fi

          echo "matrix={\"include\":$BUILD}" >> "$GITHUB_OUTPUT"
          echo "merge_matrix={\"include\":$MERGE}" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build_matrix != '{"include":[]}'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.build_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (platform-specific tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-${{ matrix.slug }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.slug }}
          cache-to: type=gha,scope=${{ matrix.component }}-${{ matrix.slug }},mode=max

  merge:
    needs: [changes, build]
    if: needs.changes.outputs.merge_matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.merge_matrix) }}

    steps:
      - name: Set image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value={{branch}}-{{sha}}
            type=raw,value={{branch}},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push multi-arch manifest
        run: |
          src="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            docker buildx imagetools create \
              --tag "$tag" \
              "${src}-amd64" \
              "${src}-arm64"
          done
