name: Docker

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      control: ${{ steps.filter.outputs.control }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            control:
              - 'Dockerfile.control'
              - 'control/**'
              - 'package.json'
              - 'bun.lock'
            client:
              - 'Dockerfile.client'
              - 'backend/**'
              - 'tui/**'
              - 'cli/**'
              - 'common/**'
              - 'package.json'
              - 'bun.lock'

  control:
    needs: changes
    if: needs.changes.outputs.control == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            bun-target: bun-linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            bun-target: bun-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/meshtalk-control
          tags: |
            type=raw,value=${{ matrix.arch }},enable={{is_default_branch}}
            type=sha,prefix=,suffix=-${{ matrix.arch }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.control
          build-args: BUN_TARGET=${{ matrix.bun-target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=control-${{ matrix.arch }}
          cache-to: type=gha,scope=control-${{ matrix.arch }},mode=max

  control-manifest:
    needs: [changes, control]
    if: needs.changes.outputs.control == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/meshtalk-control
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          TAGS="${{ steps.meta.outputs.tags }}"
          for TAG in $TAGS; do
            docker buildx imagetools create \
              -t "$TAG" \
              "ghcr.io/$OWNER/meshtalk-control:amd64" \
              "ghcr.io/$OWNER/meshtalk-control:arm64"
          done

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            bun-target: bun-linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            bun-target: bun-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/meshtalk-client
          tags: |
            type=raw,value=${{ matrix.arch }},enable={{is_default_branch}}
            type=sha,prefix=,suffix=-${{ matrix.arch }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          build-args: BUN_TARGET=${{ matrix.bun-target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=client-${{ matrix.arch }}
          cache-to: type=gha,scope=client-${{ matrix.arch }},mode=max

  client-manifest:
    needs: [changes, client]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/meshtalk-client
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          TAGS="${{ steps.meta.outputs.tags }}"
          for TAG in $TAGS; do
            docker buildx imagetools create \
              -t "$TAG" \
              "ghcr.io/$OWNER/meshtalk-client:amd64" \
              "ghcr.io/$OWNER/meshtalk-client:arm64"
          done
