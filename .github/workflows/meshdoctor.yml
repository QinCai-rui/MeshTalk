name: meshdoctor

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  meshdoctor:
    if: |
      github.event.comment.user.type != 'Bot' &&
      (
        startsWith(github.event.comment.body, '/oc ') ||
        startsWith(github.event.comment.body, '/oc\n') ||
        startsWith(github.event.comment.body, '/meshdoctor ') ||
        startsWith(github.event.comment.body, '/meshdoctor\n') ||
        startsWith(github.event.comment.body, '/opencode ') ||
        startsWith(github.event.comment.body, '/opencode\n')
      ) &&
      !startsWith(github.event.comment.body, '/oc review') &&
      !startsWith(github.event.comment.body, '/oc rereview') &&
      !startsWith(github.event.comment.body, '/meshdoctor review') &&
      !startsWith(github.event.comment.body, '/meshdoctor rereview') &&
      !startsWith(github.event.comment.body, '/opencode review') &&
      !startsWith(github.event.comment.body, '/opencode rereview')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run meshdoctor
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
