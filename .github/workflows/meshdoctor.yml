name: meshdoctor

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  meshdoctor:
    if: |
      github.event.comment.user.type != 'Bot' &&
      (
        startsWith(github.event.comment.body, '/oc ') ||
        startsWith(github.event.comment.body, '/oc\n') ||
        startsWith(github.event.comment.body, '/meshdoctor ') ||
        startsWith(github.event.comment.body, '/meshdoctor\n') ||
        startsWith(github.event.comment.body, '/opencode ') ||
        startsWith(github.event.comment.body, '/opencode\n')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Gate generic command
        id: command-gate
        uses: actions/github-script@v9
        with:
          script: |
            const command = (context.payload.comment?.body || '').split(/\r?\n/, 1)[0].trim().toLowerCase();
            const reviewCommands = new Set([
              '/meshdoctor review',
              '/meshdoctor full-review',
              '/meshdoctor help',
            ]);
            core.setOutput('run', String(!reviewCommands.has(command)));

      - name: Checkout repository
        if: steps.command-gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run meshdoctor
        if: steps.command-gate.outputs.run == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
