name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "assets/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0). Leave empty for automatic pre-release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: meshtalk-linux-x64
            suffix: ""
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: meshtalk-linux-arm64
            suffix: ""
          - os: macos-26-intel
            target: bun-darwin-x64
            artifact: meshtalk-macos-x64
            suffix: ""
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: meshtalk-macos-arm64
            suffix: ""
          - os: windows-latest
            target: bun-windows-x64
            artifact: meshtalk-windows-x64.exe
            suffix: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: bun install --os="*" --cpu="*"

      - name: Build backend binary
        run: uv run --project backend --with pyinstaller pyinstaller --noconfirm --onefile --name meshtalk-backend --distpath dist/release --workpath build/pyinstaller --specpath build/pyinstaller backend/meshtalk_launcher.py

      - name: Build CLI binary
        run: bun build ./cli/src/index.ts --compile --target=${{ matrix.target }} --outfile dist/release/meshtalk-cli${{ matrix.suffix }}

      - name: Build TUI binary
        run: bun build ./tui/src/index.tsx --compile --target=${{ matrix.target }} --define 'process.env.OPENTUI_LIBC="glibc"' --outfile dist/release/meshtalk-tui${{ matrix.suffix }}

      - name: Build launcher binary
        run: bun build ./bin/meshtalk.ts --compile --target=${{ matrix.target }} --outfile dist/release/meshtalk${{ matrix.suffix }}

      - name: Package standalone release
        run: tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist/release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            LATEST_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || echo 'v0.0.0')"
            LATEST_TAG="${LATEST_TAG#v}"
            if [[ "$LATEST_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              X="${BASH_REMATCH[1]}"
              Y="${BASH_REMATCH[2]}"
              Z=$((10#${BASH_REMATCH[3]} + 1))
            else
              X=0; Y=1; Z=0
            fi
            echo "version=${X}.${Y}.${Z}-SNAPSHOT+${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          if gh release view "$V" --json tagName > /dev/null 2>&1; then
            echo "Release ${V} already exists - skipping creation"
          elif [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            gh release create "$V" dist/*/* --title "$V" --generate-notes --prerelease
          else
            gh release create "$V" dist/*/* --title "$V" --generate-notes
          fi
