name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "assets/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0). Leave empty for automatic pre-release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump-version:
    if: inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Bump hardcoded version strings
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          echo "Bumping version to ${VERSION}"

          for f in package.json tui/package.json cli/package.json control/package.json; do
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" "$f"
          done
          sed -i "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" backend/pyproject.toml
          sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"${VERSION}\"/" backend/meshtalk/__init__.py
          python3 desktop/scripts/version.py "$VERSION"
          uv lock --directory backend

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "[ci skip] chore: bump version to ${{ inputs.version }}"
          git push origin HEAD:main

  prepare:
    needs: bump-version
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version != '' && 'main' || github.sha }}
      - id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION="$REQUESTED_VERSION"
          if [ -z "$VERSION" ]; then
            LATEST=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo 0.0.0)
            LATEST=${LATEST#v}
            if [[ "$LATEST" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              X="${BASH_REMATCH[1]}"
              Y="${BASH_REMATCH[2]}"
              Z=$((10#${BASH_REMATCH[3]} + 1))
            else
              X=0; Y=1; Z=0
            fi
            VERSION="${X}.${Y}.${Z}-SNAPSHOT+${{ github.run_number }}-${SHA:0:7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: meshtalk-linux-x64
            suffix: ""
            triple: x86_64-unknown-linux-gnu
            desktop-platform: linux
            desktop-arch: x64
            bundle: appimage
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: meshtalk-linux-arm64
            suffix: ""
            triple: aarch64-unknown-linux-gnu
            desktop-platform: linux
            desktop-arch: arm64
            bundle: appimage
          - os: macos-26-intel
            target: bun-darwin-x64
            artifact: meshtalk-macos-x64
            suffix: ""
            triple: x86_64-apple-darwin
            desktop-platform: macos
            desktop-arch: x64
            bundle: dmg
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: meshtalk-macos-arm64
            suffix: ""
            triple: aarch64-apple-darwin
            desktop-platform: macos
            desktop-arch: arm64
            bundle: dmg
          - os: windows-latest
            target: bun-windows-x64
            artifact: meshtalk-windows-x64.exe
            suffix: ".exe"
            triple: x86_64-pc-windows-msvc
            desktop-platform: windows
            desktop-arch: x64
            bundle: nsis

    runs-on: ${{ matrix.os }}

    env:
      # Keep build caches in the workspace so actions/cache can restore them
      # consistently on macOS, Linux, and Windows.
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.cache/nuitka
      CCACHE_DIR: ${{ github.workspace }}/.cache/nuitka/ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv and Nuitka build data
        uses: actions/cache@v6
        with:
          path: |
            .cache/uv
            .cache/nuitka
          # Keep a new entry per commit so newly compiled objects can be
          # saved, while restore-keys reuses the latest previous build.
          # The artifact name keeps Intel and Apple Silicon caches separate.
          key: ${{ runner.os }}-${{ matrix.artifact }}-python-3.12-${{ hashFiles('backend/uv.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.artifact }}-python-3.12-${{ hashFiles('backend/uv.lock') }}-
            ${{ runner.os }}-${{ matrix.artifact }}-python-3.12-

      - name: Install dependencies
        run: bun install --os="*" --cpu="*"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure static OpenSSL build (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 ccache
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "UV_NO_BINARY_PACKAGE=cryptography" >> "$GITHUB_ENV"

      - name: Build backend binary
        run: uv run --project backend --with 'nuitka[onefile]' python -m nuitka --mode=onefile --onefile-tempdir-spec='{CACHE_DIR}/MeshTalk/meshtalk-backend' --onefile-cache-mode=cached --output-dir=build/nuitka --output-filename=meshtalk-backend --assume-yes-for-downloads backend/meshtalk_launcher.py

      - name: Verify static OpenSSL linkage (macOS)
        if: runner.os == 'macOS'
        run: |
          RUST_SO="$(uv run --project backend python -c 'import cryptography.hazmat.bindings._rust as module; print(module.__file__)')"
          otool -L "$RUST_SO"
          if otool -L "$RUST_SO" | grep -Eq 'lib(ssl|crypto)\.[0-9]+\.dylib'; then
            echo "cryptography was linked dynamically against OpenSSL."
            exit 1
          fi

      - name: Create release directory
        run: mkdir -p dist/release

      - name: Move backend binary to release directory
        run: cp build/nuitka/meshtalk-backend${{ matrix.suffix }} dist/release/meshtalk-backend${{ matrix.suffix }}

      - name: Build launcher binary
        run: bun build ./bin/meshtalk.ts --compile --target=${{ matrix.target }} --define 'APP_VERSION="${{ needs.prepare.outputs.version }}"' --define 'MESHTALK_RELEASE=true' --define 'MESHTALK_PRERELEASE=${{ needs.prepare.outputs.prerelease }}' --outfile dist/release/meshtalk${{ matrix.suffix }}

      - name: Prepare desktop sidecar and version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python desktop/scripts/version.py "$RELEASE_VERSION"
          mkdir -p desktop/src-tauri/binaries
          cp dist/release/meshtalk-backend${{ matrix.suffix }} desktop/src-tauri/binaries/meshtalk-backend-${{ matrix.triple }}${{ matrix.suffix }}

      - name: Build unsigned desktop installer
        working-directory: desktop
        run: bun run package --bundles ${{ matrix.bundle }}

      - name: Collect desktop installer
        run: python desktop/scripts/package-assets.py ${{ matrix.desktop-platform }} ${{ matrix.desktop-arch }}

      - name: Upload desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.desktop-platform }}-${{ matrix.desktop-arch }}
          path: dist/meshtalk-desktop-*

      - name: Package standalone release
        run: tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist/release .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

  release:
    needs: [prepare, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          V="$RELEASE_VERSION"
          if gh release view "$V" --json tagName > /dev/null 2>&1; then
            echo "Release ${V} already exists - skipping creation"
          else
            NOTES_FLAG="--generate-notes"
            EXTRA_NOTES=$(cat <<'EOF'

          ## Platform Notes

          **Linux:** The precompiled binaries require **glibc 2.38** or newer (Ubuntu 24.04+, Debian 13+, Fedora 39+, or equivalent). If your distribution ships an older glibc, [compile from source](https://github.com/QinCai-rui/MeshTalk#compile-from-source) instead.
          EOF
          )
            RELEASE_ARGS=("$V" dist/*/* --target "$RELEASE_SHA" --title "$V" "$NOTES_FLAG" --notes "$EXTRA_NOTES")
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              RELEASE_ARGS+=(--prerelease)
            fi
            gh release create "${RELEASE_ARGS[@]}"
          fi
