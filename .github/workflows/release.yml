name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: meshtalk-linux-x64
          - os: ubuntu-24.04-arm
            artifact: meshtalk-linux-arm64
          - os: macos-26-intel
            target: bun-darwin-x64
            artifact: meshtalk-macos-x64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: meshtalk-macos-arm64
          - os: windows-latest
            artifact: meshtalk-windows-x64.exe
          - os: windows-11-arm
            artifact: meshtalk-windows-arm64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: bun install

      - name: Build launcher binary
        run: bun build ./bin/meshtalk.ts --compile --target=bun --outfile dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
