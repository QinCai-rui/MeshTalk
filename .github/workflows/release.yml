name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
#  push:
#    branches: ["main"]
#    paths-ignore:
#      - "assets/**"
#      - "README.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0). Leave empty for automatic pre-release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump-version:
    if: inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Bump hardcoded version strings
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          echo "Bumping version to ${VERSION}"

          for f in package.json tui/package.json cli/package.json control/package.json; do
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" "$f"
          done
          sed -i "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" backend/pyproject.toml
          sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"${VERSION}\"/" backend/meshtalk/__init__.py
          uv lock --directory backend

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "[ci skip] chore: bump version to ${{ inputs.version }}"
          git push origin HEAD:main

  build:
    needs: bump-version
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: meshtalk-linux-x64
            suffix: ""
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: meshtalk-linux-arm64
            suffix: ""
          - os: macos-26-intel
            target: bun-darwin-x64
            artifact: meshtalk-macos-x64
            suffix: ""
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: meshtalk-macos-arm64
            suffix: ""
          - os: windows-latest
            target: bun-windows-x64
            artifact: meshtalk-windows-x64.exe
            suffix: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: bun install --os="*" --cpu="*"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            LATEST_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || echo 'v0.0.0')"
            LATEST_TAG="${LATEST_TAG#v}"
            if [[ "$LATEST_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              X="${BASH_REMATCH[1]}"
              Y="${BASH_REMATCH[2]}"
              Z=$((10#${BASH_REMATCH[3]} + 1))
            else
              X=0; Y=1; Z=0
            fi
            echo "version=${X}.${Y}.${Z}-SNAPSHOT+${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure static OpenSSL build (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "UV_NO_BINARY_PACKAGE=cryptography" >> "$GITHUB_ENV"

      - name: Build backend binary
        run: uv run --project backend --with 'nuitka[onefile]' python -m nuitka --mode=onefile --onefile-tempdir-spec='{CACHE_DIR}/MeshTalk/meshtalk-backend' --onefile-cache-mode=cached --output-dir=build/nuitka --output-filename=meshtalk-backend --assume-yes-for-downloads backend/meshtalk_launcher.py

      - name: Verify static OpenSSL linkage (macOS)
        if: runner.os == 'macOS'
        run: |
          RUST_SO="$(uv run --project backend python -c 'import cryptography.hazmat.bindings._rust as module; print(module.__file__)')"
          otool -L "$RUST_SO"
          if otool -L "$RUST_SO" | grep -Eq 'lib(ssl|crypto)\.[0-9]+\.dylib'; then
            echo "cryptography was linked dynamically against OpenSSL."
            exit 1
          fi

      - name: Create release directory
        run: mkdir -p dist/release

      - name: Move backend binary to release directory
        run: cp build/nuitka/meshtalk-backend${{ matrix.suffix }} dist/release/meshtalk-backend${{ matrix.suffix }}

      - name: Build CLI binary
        run: bun build ./cli/src/index.ts --compile --target=${{ matrix.target }} --define 'APP_VERSION="${{ steps.version.outputs.version }}"' --define 'MESHTALK_RELEASE=true' --outfile dist/release/meshtalk-cli${{ matrix.suffix }}

      - name: Build TUI binary
        run: bun build ./tui/src/index.tsx --compile --target=${{ matrix.target }} --define 'process.env.OPENTUI_LIBC="glibc"' --define 'APP_VERSION="${{ steps.version.outputs.version }}"' --define 'MESHTALK_RELEASE=true' --outfile dist/release/meshtalk-tui${{ matrix.suffix }}

      - name: Build launcher binary
        run: bun build ./bin/meshtalk.ts --compile --target=${{ matrix.target }} --define 'APP_VERSION="${{ steps.version.outputs.version }}"' --define 'MESHTALK_RELEASE=true' --outfile dist/release/meshtalk${{ matrix.suffix }}

      - name: Package standalone release
        run: tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist/release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            LATEST_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || echo 'v0.0.0')"
            LATEST_TAG="${LATEST_TAG#v}"
            if [[ "$LATEST_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              X="${BASH_REMATCH[1]}"
              Y="${BASH_REMATCH[2]}"
              Z=$((10#${BASH_REMATCH[3]} + 1))
            else
              X=0; Y=1; Z=0
            fi
            echo "version=${X}.${Y}.${Z}-SNAPSHOT+${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.version.outputs.version }}"
          if gh release view "$V" --json tagName > /dev/null 2>&1; then
            echo "Release ${V} already exists - skipping creation"
          else
            NOTES_FLAG="--generate-notes"
            EXTRA_NOTES=$(cat <<'EOF'

          ## Platform Notes

          **Linux:** The precompiled binaries require **glibc 2.38** or newer (Ubuntu 24.04+, Debian 13+, Fedora 39+, or equivalent). If your distribution ships an older glibc, [compile from source](https://github.com/QinCai-rui/MeshTalk#compile-from-source) instead.
          EOF
          )
            RELEASE_ARGS=("$V" dist/*/* --title "$V" "$NOTES_FLAG" --notes "$EXTRA_NOTES")
            if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
              RELEASE_ARGS+=(--prerelease)
            fi
            gh release create "${RELEASE_ARGS[@]}"
          fi
